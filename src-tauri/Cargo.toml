[package]
name = "studyagent-desktop"
version = "0.7.0-indev"
description = "StudyAgent Learning Workspace"
authors = ["StudyAgent"]
edition = "2021"

[lib]
name = "studyagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
toml = "1.1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
tokio-stream = "0.1"
base64 = "0.23"
sha2 = "0.11"
parking_lot = "0.12"
chrono = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
keyring = { version = "4.1", features = ["windows-native-keyring-store"] }

[features]
# custom-protocol 放入 default features：任何 release 构建（含裸 `cargo build --release`、
# `installer/build.ps1 -SkipBuild` 复用旧 exe 等场景）都会内嵌 dist 前端资源，避免打包后
# 运行时去连 devUrl `http://localhost:1420` 而出现「localhost 拒绝连接」。
# `tauri dev` 会自动加 `--no-default-features` 并剔除本特性，不影响开发热重载。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
