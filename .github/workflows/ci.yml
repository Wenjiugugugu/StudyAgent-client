name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare dist for tauri generate_context
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Set-Content -Path ../dist/index.html -Value "<!doctype html><html><body></body></html>" -Encoding utf8
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  desktop-smoke:
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build the real desktop executable
        run: pnpm tauri build --no-bundle
      - name: Verify executable was produced
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/studyagent-desktop.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Desktop executable missing: $exe" }
